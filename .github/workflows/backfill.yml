name: 回補歷史收盤（手動執行）

on:
  workflow_dispatch:
    inputs:
      months:
        description: "要回補幾個月（建議 12～24，數字越大越久）"
        required: true
        default: "12"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 回補歷史
        run: python scripts/fetch_twse.py --backfill ${{ inputs.months }}
      - name: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "沒有新增歷史資料"
          else
            git commit -m "回補歷史收盤 ${{ inputs.months }} 個月"
            git push
          fi
